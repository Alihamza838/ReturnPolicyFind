<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition for smooth gradient shadows -->
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow Shadow -->
  <circle cx="256" cy="270" r="230" fill="url(#shadow)"/>

  <!-- Premium Dark Rounded App Tile Box (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGradient)" stroke="#334155" stroke-width="6"/>

  <!-- Glowing Accent Border Ring -->
  <rect x="42" y="42" width="428" height="428" rx="90" ry="90" fill="none" stroke="#0D9488" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Graphic Group Centered -->
  <g transform="translate(16, 12)">
    <!-- Elegant Receipt Sheet Shadow -->
    <path d="M165 115 L315 115 L315 385 C315 385, 305 380, 295 385 C285 390, 275 385, 275 385 C275 385, 265 380, 255 385 C245 390, 235 385, 235 385 C235 385, 225 380, 215 385 C205 390, 195 385, 195 385 C195 385, 185 380, 175 385 C165 390, 155 385, 155 385 Z" fill="#090D16" opacity="0.45"/>

    <!-- Elegant White Receipt Sheet -->
    <path d="M150 100 L300 100 L300 370 C300 370, 290 365, 280 370 C270 375, 260 370, 260 370 C260 370, 250 365, 240 370 C230 375, 220 370, 220 370 C220 370, 210 365, 200 370 C190 375, 180 370, 180 370 C180 370, 170 365, 160 370 C150 375, 140 370, 140 370 Z" fill="#FAFAF9" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round"/>

    <!-- Receipt Header Lines -->
    <line x1="180" y1="140" x2="270" y2="140" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="165" x2="240" y2="165" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>

    <!-- Receipt Items List Detail -->
    <circle cx="185" cy="205" r="5" fill="#0D9488"/>
    <line x1="205" y1="205" x2="270" y2="205" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

    <circle cx="185" cy="235" r="5" fill="#0D9488"/>
    <line x1="205" y1="235" x2="250" y2="235" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

    <!-- Bold Currency Symbol (Dollar sign) on Receipt -->
    <text x="210" y="320" font-family="'Inter', sans-serif" font-weight="900" font-size="72" fill="url(#accentGradient)" text-anchor="middle">$</text>

    <!-- Superbly Curved Flowing Return Arrow Wrapped Around the Receipt -->
    <!-- Curved back arc -->
    <path d="M330 200 C390 200, 390 330, 320 340 C280 345, 240 330, 220 310" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round"/>
    <!-- Arrow head pointing back cleanly at the receipt -->
    <path d="M232 328 L210 310 L238 296" fill="none" stroke="#2DD4BF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
